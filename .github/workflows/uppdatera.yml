name: Uppdatera viltdata

on:
  schedule:
    # Tiderna är UTC och följer inte sommartid.
    - cron: "0 1 * * *"    # ca 03:00 svensk sommartid, 02:00 vintertid
    - cron: "0 10 * * *"   # ca 12:00 svensk sommartid, 11:00 vintertid
  workflow_dispatch:        # gör att du kan trycka igång den för hand

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta observationer
        run: python hamta.py

      - name: Committa om datan ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --quiet --staged; then
            echo "Ingen ny data."
          else
            git commit -m "Uppdaterad viltdata $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
